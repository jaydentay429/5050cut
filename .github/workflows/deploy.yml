# Deploy the Direct Upload Pages project `precise-cut` (5050cut.com).
#
# Production vs preview is decided by the project's production branch in
# Cloudflare (Workers & Pages → precise-cut → Settings → Production branch),
# not by the Git branch name alone. This repo cannot see that setting.
# Local `npm run deploy:pages` omits --branch, so Wrangler uses whatever
# git branch the owner was on. `--branch main` below is a production
# deployment only when the dashboard production branch is `main`.
# If it is something else, change --branch to that name before merging.
#
# `actions/checkout` leaves a detached HEAD. Without an explicit --branch,
# Wrangler would deploy to a branch literally named "HEAD" (a preview).
#
# No `npm ci`: scripts/pack-pages.mjs uses only Node built-ins. Wrangler is
# fetched with npx at the lockfile version (4.139.0) instead of installing
# the rest of package.json (sharp, three, gltf-transform, …).
# wrangler-action would run `npm i wrangler@…` inside this repo, which also
# installs those unused dependencies.
#
# Wrangler 4.139.0 exits unless Node is >= 22. This repo has no engines
# field and no .nvmrc. Node 22 is the oldest version that binary accepts.
#
# D1 migrations are not applied here. Schema changes stay a manual step.

name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel a superseded push so an older deploy cannot finish last and
# replace production with stale assets.
concurrency:
  group: pages-precise-cut-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch can be started from any branch. Never publish a
    # non-main checkout onto the production branch name.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack Pages output
        run: node scripts/pack-pages.mjs

      # Wrangler compiles Pages Functions from <cwd>/functions, not from
      # dist/functions. pack-pages also copies functions/ into dist/, which
      # matches `npm run deploy:pages`. Bindings come from wrangler.jsonc
      # because it sets pages_build_output_dir (the file is the source of
      # truth). The command must run at the repo root so both are found.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.139.0 pages deploy dist --project-name precise-cut --branch main
